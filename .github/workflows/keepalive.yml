name: okx-keepalive
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: wake + keepalive loop
        env:
          INSTABOX_KEY: ${{ secrets.INSTABOX_KEY }}
          MACHINE_ID: ${{ secrets.MACHINE_ID }}
          SSH_TOKEN: ${{ secrets.INSTABOX_SSH_TOKEN }}
        run: |
          # wake phase: handle 409 machine_cooldown by retrying up to 25 min
          for i in $(seq 1 25); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 \
              -X POST "https://api.instabox.sh/v1/machines/$MACHINE_ID/wake" \
              -H "X-API-Key: $INSTABOX_KEY") || code=000
            state=$(curl -sS --max-time 60 -H "X-API-Key: $INSTABOX_KEY" \
              "https://api.instabox.sh/v1/machines/$MACHINE_ID" | grep -o '"state":"[a-z]*"' | head -1)
            echo "wake try $i code=$code state=$state"
            case "$state" in '"state":"running"') break;; esac
            sleep 60
          done
          end=$((SECONDS + 340*60))
          while [ $SECONDS -lt $end ]; do
            out=$(ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=45 "$SSH_TOKEN@ssh.instabox.sh" 'date -u' 2>/dev/null) && ok=ssh || ok=fail
            if [ "$ok" = fail ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 -X POST \
                -H "X-API-Key: $INSTABOX_KEY" -H 'Content-Type: application/json' \
                -H "Idempotency-Key: ka-$(date -u +%s)-$RANDOM$RANDOM" \
                -d '{"cmd":"date -u"}' \
                "https://api.instabox.sh/v1/machines/$MACHINE_ID/exec") || code=000
              ok="exec code=$code"
            fi
            echo "$(date -u '+%F %T') ping ok=$ok $out"
            sleep 300
          done
          echo "handoff done, next scheduled job takes over"
