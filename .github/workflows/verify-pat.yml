name: verify-pat

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check KEEPALIVE_PAT
        run: |
          code=$(curl -sS -o /tmp/u.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.KEEPALIVE_PAT }}" \
            -H "Accept: application/vnd.github+json" https://api.github.com/user)
          echo "user_api=$code"
          test "$code" = "200"